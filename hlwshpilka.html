<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>типа с хелуинчиком</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    text-align: center;
    padding: 20px;
  }

  /* Луна — без анимации */
  .moon {
    position: absolute;
    top: -120px;
    right: -60px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8d6, #f5d76e);
    box-shadow: 0 0 40px 10px rgba(245, 215, 110, 0.35);
  }

  /* Мыши — статично, без полёта */
  .bat {
    position: absolute;
    font-size: 26px;
    opacity: 0.8;
  }
  .bat1 { top: 30px; left: 10px; }
  .bat2 { top: 80px; left: 30px; font-size: 18px; }
  .bat3 { top: 10px; left: 60px; font-size: 32px; }

  /* Тыква — лёгкое свечение через box-shadow, без drop-shadow и анимаций */
  .pumpkin {
    position: relative;
    width: 200px;
    height: 180px;
    margin: 0 auto 30px;
    cursor: pointer;
    border-radius: 50%;
    box-shadow:
      0 0 25px 8px rgba(255,255,255,0.7),
      0 0 60px 20px rgba(255,255,255,0.35);
    transition: transform 0.15s;
  }
</head>
<body>

  <div class="scene">
    <div class="moon"></div>
    <div class="bat bat1">🦇</div>
    <div class="bat bat2">🦇</div>
    <div class="bat bat3">🦇</div>

    <div class="pumpkin" id="pumpkin">
      <div class="stem"></div>
      <div class="body">
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
        <div class="glow"></div>
      </div>
    </div>

    <h1 class="title">типа с хелуинчиком<br><span id="name">лпшк</span> 🎃</h1>
    <p class="hint">нажми на тыкву 👆</p>
    <div class="message" id="message">ты жутка милая лпшка 👻</div>
  </div>

  <script>
    var pumpkin = document.getElementById('pumpkin');
    var message = document.getElementById('message');
    var nameEl = document.getElementById('name');

    // 👇 имя подруги
    nameEl.textContent = 'шпелечка';

    var clicked = false;
    var emojis = ['\uD83C\uDF83', '\uD83D\uDC7B', '\uD83E\uDD87', '\uD83C\uDF6C', '\uD83D\uDD77', '\uD83D\uDC80'];

    pumpkin.addEventListener('click', function () {
      if (message.className.indexOf('show') === -1) {
        message.className = 'message show';
      } else {
        message.className = 'message';
      }

      if (!clicked) {
        for (var i = 0; i < 12; i++) {
          createConfetti();
        }
        clicked = true;
      }
    });

    function createConfetti() {
      var el = document.createElement('span');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.position = 'fixed';
      el.style.left = '50%';
      el.style.top = '50%';
      el.style.fontSize = '24px';
      el.style.pointerEvents = 'none';
      el.style.transition = 'all 1.2s ease-out';
      el.style.zIndex = '999';
      document.body.appendChild(el);

      var angle = Math.random() * Math.PI * 2;
      var dist = 150 + Math.random() * 200;
      var x = Math.cos(angle) * dist;
      var y = Math.sin(angle) * dist;
      var rot = Math.random() * 720;

      void el.offsetWidth;

      el.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rot + 'deg)';
      el.style.opacity = '0';

      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1300);
    }
  </script>

</body>
</html>
