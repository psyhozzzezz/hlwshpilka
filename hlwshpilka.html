<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>типа с хелуинчиком</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      text-align: center;
      padding: 20px;
    }

    .moon {
      position: absolute;
      top: -120px;
      right: -60px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8d6, #f5d76e);
      box-shadow: 0 0 40px 10px rgba(245, 215, 110, 0.35);
    }

    .bat {
      position: absolute;
      font-size: 26px;
      opacity: 0.8;
    }
    .bat1 { top: 30px; left: 10px; }
    .bat2 { top: 80px; left: 30px; font-size: 18px; }
    .bat3 { top: 10px; left: 60px; font-size: 32px; }

    .pumpkin {
      position: relative;
      width: 200px;
      height: 180px;
      margin: 0 auto 30px;
      cursor: pointer;
      border-radius: 50%;
      box-shadow:
        0 0 25px 8px rgba(255,255,255,0.7),
        0 0 60px 20px rgba(255,255,255,0.35);
      transition: transform 0.15s;
    }
    .pumpkin:hover  { transform: scale(1.04); }
    .pumpkin:active { transform: scale(0.96); }

    .body {
      position: absolute;
      inset: 0;
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      background: radial-gradient(ellipse at 50% 35%, #ffb347 0%, #ff8c1a 35%, #e36414 65%, #a63c00 100%);
      overflow: hidden;
      box-shadow:
        inset -15px -15px 30px rgba(120, 40, 0, 0.6),
        inset 12px 12px 25px rgba(255, 210, 120, 0.5);
    }

    .rib {
      position: absolute;
      top: -5%;
      height: 110%;
      width: 40%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(120, 40, 0, 0.5) 0%, rgba(120, 40, 0, 0) 70%);
    }
    .rib:nth-child(1) { left: -8%; width: 45%; }
    .rib:nth-child(2) { left: 12%; }
    .rib:nth-child(3) { left: 30%; background: radial-gradient(ellipse at center, rgba(255,220,150,0.4) 0%, transparent 70%); }
    .rib:nth-child(4) { left: 50%; }
    .rib:nth-child(5) { left: 70%; }

    .stem {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%) rotate(6deg);
      width: 18px;
      height: 30px;
      background: linear-gradient(90deg, #3d6b23, #5c9c33, #3d6b23);
      border-radius: 6px 6px 3px 3px;
      z-index: 3;
    }

    .face { position: absolute; inset: 0; z-index: 2; }

    .eye {
      position: absolute;
      top: 58px;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 26px solid #ffd23f;
    }
    .eye.left  { left: 38px;  transform: rotate(-8deg); }
    .eye.right { right: 38px; transform: rotate(8deg); }

    .nose {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 13px solid #ffd23f;
    }

    .mouth {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 30px;
      background: #ffd23f;
      clip-path: polygon(
        0% 0%, 12% 55%, 24% 0%, 36% 55%, 48% 0%,
        60% 55%, 72% 0%, 84% 55%, 100% 0%,
        100% 100%, 0% 100%
      );
    }

    .glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 55%, rgba(255, 200, 80, 0.3) 0%, transparent 60%);
      pointer-events: none;
    }

    .title {
      color: #f5d76e;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .hint {
      color: #b39ddb;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .message {
      color: #fff;
      max-width: 280px;
      margin: 0 auto;
      font-size: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s, transform 0.4s;
      line-height: 1.4;
    }
    .message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="moon"></div>
    <div class="bat bat1">🦇</div>
    <div class="bat bat2">🦇</div>
    <div class="bat bat3">🦇</div>

    <div class="pumpkin" id="pumpkin">
      <div class="stem"></div>
      <div class="body">
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
        <div class="glow"></div>
      </div>
    </div>

    <h1 class="title">типа с хелуинчиком<br><span id="name">лпшк</span> 🎃</h1>
    <p class="hint">нажми на тыкву 👆</p>
    <div class="message" id="message">ты жутка милая лпшка 👻</div>
  </div>

  <script>
    var pumpkin = document.getElementById('pumpkin');
    var message = document.getElementById('message');
    var nameEl = document.getElementById('name');

    nameEl.textContent = 'шпелечка';

    var clicked = false;
    var emojis = ['\uD83C\uDF83', '\uD83D\uDC7B', '\uD83E\uDD87', '\uD83C\uDF6C', '\uD83D\uDD77', '\uD83D\uDC80'];

    pumpkin.addEventListener('click', function () {
      if (message.className.indexOf('show') === -1) {
        message.className = 'message show';
      } else {
        message.className = 'message';
      }

      if (!clicked) {
        for (var i = 0; i < 12; i++) {
          createConfetti();
        }
        clicked = true;
      }
    });

    function createConfetti() {
      var el = document.createElement('span');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.position = 'fixed';
      el.style.left = '50%';
      el.style.top = '50%';
      el.style.fontSize = '24px';
      el.style.pointerEvents = 'none';
      el.style.transition = 'all 1.2s ease-out';
      el.style.zIndex = '999';
      document.body.appendChild(el);

      var angle = Math.random() * Math.PI * 2;
      var dist = 150 + Math.random() * 200;
      var x = Math.cos(angle) * dist;
      var y = Math.sin(angle) * dist;
      var rot = Math.random() * 720;

      void el.offsetWidth;

      el.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rot + 'deg)';
      el.style.opacity = '0';

      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1300);
    }
  </script>

</body>
</html>
