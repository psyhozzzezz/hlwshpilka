<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>типа с хелуинчиком</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1a0b2e 0%, #0a0410 60%, #000 100%);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Звёзды на фоне — лёгкие точки через box-shadow */
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .stars::before,
    .stars::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        40px 60px #fff, 120px 20px #fff, 200px 90px #fff,
        300px 40px #fff, 80px 150px #fff, 250px 180px #fff,
        350px 130px #fff, 30px 250px #fff, 180px 300px #fff,
        320px 280px #fff, 90px 350px #fff, 280px 380px #fff,
        150px 420px #fff, 380px 200px #fff, 60px 480px #fff;
      opacity: 0.7;
    }
    .stars::after {
      width: 1px;
      height: 1px;
      box-shadow:
        70px 110px #fff, 160px 70px #fff, 240px 140px #fff,
        330px 100px #fff, 50px 200px #fff, 210px 240px #fff,
        370px 320px #fff, 110px 400px #fff, 290px 450px #fff,
        25px 340px #fff, 340px 60px #fff, 140px 210px #fff;
      opacity: 0.5;
    }

    .scene {
      position: relative;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }

    /* Луна */
    .moon {
      position: absolute;
      top: -130px;
      right: -70px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8d6 0%, #f5d76e 55%, #d9a83a 100%);
      box-shadow:
        0 0 40px 12px rgba(245, 215, 110, 0.45),
        0 0 90px 30px rgba(245, 215, 110, 0.2);
    }
    /* Кратеры */
    .moon::before,
    .moon::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(180, 140, 40, 0.35);
    }
    .moon::before { width: 26px; height: 26px; top: 30px; left: 28px; }
    .moon::after  { width: 16px; height: 16px; top: 70px; left: 75px; }

    /* Мыши — статично, но красиво */
    .bat {
      position: absolute;
      font-size: 30px;
      opacity: 0.9;
      filter: none;
    }
    .bat1 { top: 40px;  left: 20px;  transform: rotate(-12deg); }
    .bat2 { top: 120px; left: 60px;  font-size: 20px; transform: rotate(8deg); }
    .bat3 { top: 20px;  right: 40px; font-size: 34px; transform: rotate(10deg); }

    /* Тыква */
    .pumpkin {
      position: relative;
      width: 220px;
      height: 200px;
      margin: 0 auto 34px;
      cursor: pointer;
      transition: transform 0.2s;
      /* Мягкое белое свечение вокруг — box-shadow, не drop-shadow */
      border-radius: 50%;
      box-shadow:
        0 0 20px 6px rgba(255, 255, 255, 0.65),
        0 0 50px 18px rgba(255, 255, 255, 0.3),
        0 0 100px 40px rgba(255, 200, 120, 0.15);
    }
    .pumpkin:hover  { transform: scale(1.04); }
    .pumpkin:active { transform: scale(0.96); }

    .body {
      position: absolute;
      inset: 0;
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      background: radial-gradient(ellipse at 50% 32%, #ffc266 0%, #ff8c1a 35%, #e36414 65%, #a63c00 100%);
      overflow: hidden;
      box-shadow:
        inset -22px -22px 45px rgba(110, 35, 0, 0.65),
        inset 16px 16px 38px rgba(255, 215, 130, 0.55);
    }

    /* Рёбра */
    .rib {
      position: absolute;
      top: -5%;
      height: 110%;
      width: 40%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(110, 35, 0, 0.55) 0%, rgba(110, 35, 0, 0) 70%);
      pointer-events: none;
    }
    .rib:nth-child(1) { left: -8%; width: 45%; }
    .rib:nth-child(2) { left: 12%; }
    .rib:nth-child(3) { left: 30%; background: radial-gradient(ellipse at center, rgba(255,225,160,0.5) 0%, transparent 70%); width: 40%; }
    .rib:nth-child(4) { left: 50%; }
    .rib:nth-child(5) { left: 70%; }

    /* Стебель */
    .stem {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%) rotate(6deg);
      width: 22px;
      height: 36px;
      background: linear-gradient(90deg, #2f5419, #5c9c33 50%, #2f5419);
      border-radius: 7px 7px 3px 3px;
      z-index: 3;
      box-shadow: inset -4px 0 5px rgba(0,0,0,0.45);
    }

    /* Лицо */
    .face { position: absolute; inset: 0; z-index: 2; }

    .eye {
      position: absolute;
      top: 62px;
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-bottom: 30px solid #ffd23f;
      /* Свечение глаз через box-shadow на псевдоэлементе не выйдет (треугольник), 
         поэтому просто яркий цвет + мягкая тень через filter: none не используем */
    }
    .eye.left  { left: 40px;  transform: rotate(-8deg); }
    .eye.right { right: 40px; transform: rotate(8deg); }

    /* Внутренний огонёк глаза — маленький кружок поверх */
    .eye::after {
      content: '';
      position: absolute;
      top: 6px;
      left: -10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,80,0.6), transparent 70%);
    }

    .nose {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 16px solid #ffd23f;
    }

    .mouth {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 104px;
      height: 36px;
      background: #ffd23f;
      clip-path: polygon(
        0% 0%, 12% 55%, 24% 0%, 36% 55%, 48% 0%,
        60% 55%, 72% 0%, 84% 55%, 100% 0%,
        100% 100%, 0% 100%
      );
      border-radius: 0 0 8px 8px;
    }

    /* Тёплое внутреннее свечение (без анимации) */
    .glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 55%, rgba(255, 200, 80, 0.4) 0%, transparent 62%);
      pointer-events: none;
    }

    /* Текст */
    .title {
      color: #f5d76e;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(245, 215, 110, 0.55);
    }

    .hint {
      color: #b39ddb;
      font-size: 14px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .message {
      color: #fff;
      max-width: 300px;
      margin: 0 auto;
      font-size: 16px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.45s, transform 0.45s;
      line-height: 1.45;
      text-shadow: 0 0 12px rgba(255,255,255,0.35);
    }
    .message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="scene">
    <div class="moon"></div>
    <div class="bat bat1">🦇</div>
    <div class="bat bat2">🦇</div>
    <div class="bat bat3">🦇</div>

    <div class="pumpkin" id="pumpkin">
      <div class="stem"></div>
      <div class="body">
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="rib"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
        <div class="glow"></div>
      </div>
    </div>

    <h1 class="title">типа с хелуинчиком<br><span id="name">лпшк</span> 🎃</h1>
    <p class="hint">нажми на тыкву 👆</p>
    <div class="message" id="message">ты жутка милая лпшка 👻</div>
  </div>

  <script>
    var pumpkin = document.getElementById('pumpkin');
    var message = document.getElementById('message');
    var nameEl = document.getElementById('name');

    nameEl.textContent = 'шпелечка';

    var clicked = false;
    var emojis = ['\uD83C\uDF83', '\uD83D\uDC7B', '\uD83E\uDD87', '\uD83C\uDF6C', '\uD83D\uDD77', '\uD83D\uDC80'];

    pumpkin.addEventListener('click', function () {
      if (message.className.indexOf('show') === -1) {
        message.className = 'message show';
      } else {
        message.className = 'message';
      }

      if (!clicked) {
        for (var i = 0; i < 12; i++) {
          createConfetti();
        }
        clicked = true;
      }
    });

    function createConfetti() {
      var el = document.createElement('span');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.position = 'fixed';
      el.style.left = '50%';
      el.style.top = '50%';
      el.style.fontSize = '24px';
      el.style.pointerEvents = 'none';
      el.style.transition = 'all 1.2s ease-out';
      el.style.zIndex = '999';
      document.body.appendChild(el);

      var angle = Math.random() * Math.PI * 2;
      var dist = 150 + Math.random() * 200;
      var x = Math.cos(angle) * dist;
      var y = Math.sin(angle) * dist;
      var rot = Math.random() * 720;

      void el.offsetWidth;

      el.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rot + 'deg)';
      el.style.opacity = '0';

      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1300);
    }
  </script>

</body>
</html>
